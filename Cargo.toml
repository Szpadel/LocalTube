[workspace]

[package]
default-run = "localtube-cli"
edition = "2021"
name = "localtube"
publish = false
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.2.0" }

[dependencies]

loco-rs = { workspace = true }
migration = { path = "migration" }

async-trait = "0.1.92"
chrono = "0.4.45"
sea-orm = { version = "2.0.4", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
validator = { version = "0.20.0" }

axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
include_dir = "0.7.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4"] }

# view engine i18n
fluent-templates = { version = "0.15.1", features = ["tera"] }
tera = "2.4.0"
unic-langid = "0.9.6"
# /view engine

# app
yt-dlp = "2.8.3"
tokio-process-terminate = "0.3.2"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
thiserror = "2.0.21"

[[bin]]
name = "localtube-cli"
path = "src/bin/main.rs"
required-features = []

[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
insta = { version = "1.48.0", features = ["redactions", "yaml", "filters"] }
loco-rs = { workspace = true, features = ["testing"] }
rstest = "0.27.0"
serial_test = "4.0.1"
